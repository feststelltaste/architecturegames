<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qualitäts-Workshop – Architekturspiele</title>
  <meta name="description" content="Hör den Beteiligten zu und bewerte die Qualitätsmerkmale nach ISO 25010 auf dem Radar-Poster.">
  <meta name="theme-color" content="#0d0820">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Archi-Spiele">
  <link rel="stylesheet" href="../../assets/retro.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="btn back" href="../../">Menü</a>
    <h1>Qualitäts-Workshop</h1>
    <span class="topbar-note">ISO/IEC 25010</span>
  </header>

  <main class="layout">
    <section class="stage-col">
      <div class="frame">
        <div class="stage-wrap" id="stageWrap">
          <div id="stage">

            <!-- Raum -->
            <svg id="room" viewBox="0 0 960 700" width="960" height="700" shape-rendering="crispEdges" aria-hidden="true">
              <rect width="960" height="300" fill="#3f7d8c"/>
              <rect y="0" width="960" height="14" fill="#2f6270"/>
              <rect y="204" width="960" height="96" fill="#2c5a68"/>
              <rect y="204" width="960" height="6" fill="#d8c9a0"/>
              <rect y="210" width="960" height="3" fill="#1d3f4a"/>
              <!-- Fenster -->
              <rect x="52" y="36" width="216" height="150" fill="#e8dcc0"/>
              <rect x="62" y="46" width="196" height="130" fill="#79c7f2"/>
              <rect x="62" y="46" width="196" height="30" fill="#5db4e8"/>
              <rect x="86" y="92" width="52" height="10" fill="#fff"/><rect x="98" y="84" width="40" height="10" fill="#fff"/>
              <rect x="176" y="110" width="60" height="10" fill="#fff"/><rect x="188" y="102" width="40" height="10" fill="#fff"/>
              <rect x="224" y="52" width="22" height="22" fill="#ffe36b"/><rect x="220" y="56" width="30" height="14" fill="#ffe36b"/>
              <rect x="62" y="130" width="196" height="46" fill="#5a7f9c"/>
              <rect x="70" y="118" width="30" height="58" fill="#6a8aa6"/><rect x="104" y="104" width="24" height="72" fill="#587894"/><rect x="132" y="122" width="40" height="54" fill="#6a8aa6"/><rect x="176" y="112" width="26" height="64" fill="#587894"/><rect x="206" y="126" width="46" height="50" fill="#6a8aa6"/>
              <rect x="156" y="46" width="8" height="130" fill="#e8dcc0"/>
              <rect x="62" y="108" width="196" height="8" fill="#e8dcc0"/>
              <rect x="44" y="184" width="232" height="12" fill="#cbb98c"/>
              <!-- Uhr -->
              <rect x="452" y="26" width="48" height="48" fill="#222"/>
              <rect x="456" y="30" width="40" height="40" fill="#f5f0dc"/>
              <rect x="475" y="34" width="3" height="18" fill="#222"/><rect x="475" y="49" width="14" height="3" fill="#222"/>
              <rect x="474" y="48" width="5" height="5" fill="#c0392b"/>
              <!-- Whiteboard -->
              <rect x="668" y="34" width="240" height="152" fill="#9a9a9a"/>
              <rect x="674" y="40" width="228" height="140" fill="#f4f6f6"/>
              <rect x="684" y="56" width="80" height="6" fill="#2a56c0"/>
              <rect x="684" y="72" width="130" height="6" fill="#2a56c0"/>
              <rect x="684" y="88" width="104" height="6" fill="#c0392b"/>
              <rect x="800" y="110" width="12" height="12" fill="#2a8a4a"/><rect x="820" y="110" width="12" height="12" fill="#2a8a4a"/><rect x="840" y="110" width="12" height="12" fill="#2a8a4a"/>
              <rect x="684" y="110" width="100" height="6" fill="#2a56c0"/>
              <rect x="684" y="150" width="60" height="6" fill="#2a56c0"/>
              <rect x="674" y="180" width="228" height="8" fill="#7a7a7a"/>
              <rect x="700" y="176" width="26" height="6" fill="#c0392b"/><rect x="734" y="176" width="26" height="6" fill="#2a56c0"/>
              <!-- Deckenlampe -->
              <rect x="476" y="0" width="4" height="8" fill="#222"/>
              <!-- Pflanze -->
              <rect x="20" y="236" width="44" height="48" fill="#b5602f"/><rect x="16" y="230" width="52" height="10" fill="#c97a40"/>
              <rect x="26" y="170" width="10" height="60" fill="#2f8a3a"/><rect x="42" y="150" width="10" height="80" fill="#3aa84a"/><rect x="52" y="190" width="10" height="42" fill="#2f8a3a"/>
              <rect x="14" y="182" width="14" height="10" fill="#3aa84a"/><rect x="50" y="162" width="20" height="10" fill="#2f8a3a"/><rect x="30" y="160" width="16" height="10" fill="#3aa84a"/>
              <!-- Bild -->
              <rect x="316" y="46" width="70" height="56" fill="#222"/><rect x="322" y="52" width="58" height="44" fill="#f1d9a4"/>
              <rect x="330" y="78" width="14" height="18" fill="#a05a2a"/><rect x="348" y="66" width="14" height="30" fill="#c06a2a"/><rect x="364" y="72" width="12" height="24" fill="#8a4a1a"/>
              <!-- Boden -->
              <rect y="300" width="960" height="400" fill="#3b3d6b"/>
              <rect y="296" width="960" height="10" fill="#5a3a22"/>
              <rect y="306" width="960" height="4" fill="#2a1a10"/>
              <g fill="#34365e"><rect y="320" width="960" height="3"/><rect y="352" width="960" height="3"/><rect y="388" width="960" height="3"/><rect y="428" width="960" height="3"/><rect y="472" width="960" height="3"/><rect y="520" width="960" height="3"/><rect y="572" width="960" height="3"/><rect y="628" width="960" height="3"/><rect y="688" width="960" height="3"/></g>
              <g fill="#454880"><rect x="40" y="340" width="6" height="3"/><rect x="180" y="460" width="6" height="3"/><rect x="860" y="360" width="6" height="3"/><rect x="800" y="600" width="6" height="3"/><rect x="90" y="620" width="6" height="3"/></g>
            </svg>

            <div id="people"></div>

            <!-- Tisch -->
            <div id="table">
              <canvas id="mug" class="decor" aria-hidden="true"></canvas>
              <canvas id="pad" class="decor" aria-hidden="true"></canvas>
            </div>
            <div id="plates"></div>

            <!-- Poster -->
            <div id="posterStage">
              <div id="poster">
                <svg id="radar" viewBox="-250 -250 500 500" aria-label="Qualitäts-Poster nach ISO 25010"></svg>
              </div>
            </div>

            <div id="bubbles"></div>
            <div id="crt"></div>
          </div>
        </div>
        <!-- Titelbild -->
        <div id="title" class="overlay"></div>
      </div>
      <div id="speechPanel" class="speech-panel" aria-live="polite"></div>
      <div id="verbbar" class="verbbar" data-mode="title">
        <div class="vb-read">
          <div id="readout" class="readout">Fahre mit der Maus über das Poster.</div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
        </div>
        <div class="vb-btns">
          <button class="btn" id="btnOrder" type="button">Auftrag</button>
          <button class="btn" id="btnNotes" type="button">Notizbuch <span id="notesCount" class="count"></span></button>
          <button class="btn" id="btnScale" type="button">Skala</button>
          <button class="btn" id="zoomBtn" type="button">Poster groß</button>
          <button class="btn" id="btnFull" type="button" hidden>Vollbild</button>
          <button class="btn primary vb-play" id="submitBtn" type="button">Einschätzung abgeben</button>
          <button class="btn vb-result" id="btnResult" type="button">Auswertung</button>
          <button class="btn primary vb-result" id="btnNext" type="button">Nächster Fall</button>
          <button class="btn vb-result" id="btnAgain" type="button">Nochmal</button>
          <button class="btn vb-result" id="btnMenu" type="button">Fallauswahl</button>
        </div>
      </div>
      <p class="hint-mobile">Tipp: Tippe auf die Personen, um ihnen zuzuhören.</p>
    </section>

  </main>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="sheet-head"><h2 id="sheetTitle">Auftrag</h2><button class="sheet-x" id="sheetClose" type="button" aria-label="Schließen">&times;</button></header>
      <div class="sheet-body">
        <section data-sheet="order"><p id="orderText" class="order">Wähle einen Fall im Titelbild.</p><div class="sheet-actions"><button class="btn primary" data-close type="button">Los geht&rsquo;s</button></div></section>
        <section data-sheet="notes"><div id="notes" class="notes"></div></section>
        <section data-sheet="scale"><p class="scale-intro">So viele Punkte bedeuten so viel:</p><table id="scale" class="scale"></table></section>
        <section data-sheet="result"><div id="resultBody"></div></section>
      </div>
    </div>
  </div>

  <div id="fullView" class="fullview" hidden role="dialog" aria-label="Poster im Vollbild">
    <div class="fv-bar">
      <div id="readoutFull" class="inset readout">Tippe oder ziehe auf dem Poster, um Punkte zu vergeben.</div>
      <div class="btn-row">
        <button class="btn" id="fullClose" type="button">&larr; Zum Tisch</button>
        <button class="btn primary" id="fullSubmit" type="button">Einschätzung abgeben</button>
      </div>
      <div id="statusFull" class="status" role="status" aria-live="polite"></div>
      <div id="fullLegend" class="fv-legend" hidden><b style="color:#1f4fd8">&mdash;</b> deine Punkte &nbsp; <b style="color:#16883e">- -</b> gemeint</div>
    </div>
    <div id="fullHolder" class="fv-holder"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('../../sw.js').catch(function () {}); });
    }
  </script>
  <script src="data.js"></script>
  <script src="sprites.js"></script>
  <script src="game.js"></script>
</body>
</html>
